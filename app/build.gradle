plugins {
    id 'com.android.application'
}

// Upload key: read from environment variables (GitHub Actions secrets) or keystore.properties (local builds).
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) { ksFile.withInputStream { ksProps.load(it) } }
def signValue = { String key, String env -> System.getenv(env) ?: ksProps.getProperty(key) }
def storePath = signValue('storeFile', 'TIDY_KEYSTORE_FILE')
def hasSigning = storePath != null && file(storePath).exists()

android {
    namespace 'com.tidynook.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tidynook.game'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasSigning) {
            upload {
                storeFile file(storePath)
                storePassword signValue('storePassword', 'TIDY_KEYSTORE_PASSWORD')
                keyAlias signValue('keyAlias', 'TIDY_KEY_ALIAS')
                keyPassword signValue('keyPassword', 'TIDY_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) { signingConfig signingConfigs.upload }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
