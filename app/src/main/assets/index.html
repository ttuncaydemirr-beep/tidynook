<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
@font-face{font-family:"Baloo Bhaijaan 2";src:url("fonts/BalooBhaijaan2.ttf") format("truetype");font-weight:400 800;font-display:block}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Tidy Nook</title>
<style>
/* Layout: one-screen phone game — slim header; two screens: the house (progress) and the board (container above, rug below) */
:root{
  --bg:#F4EFF7; --fg:#352D40; --muted:#7D7389; --surface:#FFFFFF; --mat:#B3A5C6; --stitch:rgba(255,255,255,.55);
  --line:#DCD2E5; --accent:#C9587C; --accent-ink:#FFFFFF; --mint:#7FC4AA; --mint-ink:#173A2E; --houseline:#3A3046;
  --danger:#B23A55; --scrim:rgba(30,20,40,.45);
  --font:"Baloo Bhaijaan 2", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1A26; --fg:#F1EAF6; --muted:#A89DB4; --surface:#2B2433; --mat:#4A3F58; --stitch:rgba(255,255,255,.22);
  --line:#3C3447; --accent:#EC8FAD; --accent-ink:#2A1720; --mint:#86CDB3; --mint-ink:#123026; --houseline:#0F0C14;
  --danger:#F08AA0; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F1A26; --fg:#F1EAF6; --muted:#A89DB4; --surface:#2B2433; --mat:#4A3F58; --stitch:rgba(255,255,255,.22);
  --line:#3C3447; --accent:#EC8FAD; --accent-ink:#2A1720; --mint:#86CDB3; --mint-ink:#123026; --houseline:#0F0C14;
  --danger:#F08AA0; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:18px;margin-inline-end:auto;display:flex;align-items:center;gap:6px}
.brand svg{flex:none}
.langs{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;
  min-width:36px;min-height:32px;padding:0 8px;border-radius:999px}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sheet .langs{border-radius:18px}
.icon{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--fg);display:grid;place-items:center;padding:0}

.head{display:flex;align-items:flex-end;gap:10px}
.titles{flex:1;min-width:0}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
[dir="rtl"] .eyebrow{letter-spacing:0}
h1{margin:0;font-size:clamp(23px,7vw,32px);line-height:1.1;font-weight:800;text-wrap:balance}
.hintbtn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:0;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;flex:none}

.stage{flex:1;min-height:0;position:relative}
.stage > svg{width:100%;height:100%;display:block}
[hidden]{display:none!important}
#board{touch-action:none}
.tray{fill:var(--mat)}
.stitch{fill:none;stroke:var(--stitch);stroke-width:2;stroke-dasharray:6 5}
.item{cursor:grab}
.item .art{filter:drop-shadow(0 2px 1.5px rgba(20,12,30,.25))}
.item.lift{cursor:grabbing}
.item.lift .art{filter:drop-shadow(0 8px 7px rgba(20,12,30,.3))}
.item.placed{pointer-events:none}
.item.placed .art{filter:none}
.art,.ghost,.deco{transform-box:fill-box;transform-origin:center}
.deco{transform-origin:center bottom}
.item.hint .art{animation:wig .5s ease-in-out 3}
.ghost.hint{animation:glow .5s ease-in-out 3}
.deco.pop{animation:grow .7s cubic-bezier(.2,1.5,.4,1) .25s both}
@keyframes wig{0%,100%{transform:none}25%{transform:rotate(-9deg) scale(1.1)}75%{transform:rotate(9deg) scale(1.1)}}
@keyframes glow{50%{opacity:.25}}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
.houseline{stroke:var(--houseline)}

.win{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(330px,100%);
  background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px 20px 20px;text-align:center;
  box-shadow:0 18px 40px rgba(20,12,30,.25);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.win h2{margin:0;font-size:30px;line-height:1.1;font-weight:800}
.win p{margin:2px 0 0;color:var(--muted);font-size:15px}
.reward{display:flex;align-items:center;gap:10px;margin:12px 0 14px;padding:8px 12px;border-radius:16px;background:var(--bg);text-align:start}
.reward svg{flex:none}
.reward b{display:block;font-size:15px;line-height:1.2}
.reward span{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.primary{min-height:48px;padding:0 24px;border-radius:999px;border:0;background:var(--fg);color:var(--bg);font-weight:700;font-size:16px}
.secondary{min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);font-weight:700;font-size:16px}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.85)}to{opacity:1;transform:translateX(-50%) scale(1)}}

.foot{display:flex;flex-direction:column;align-items:center;gap:4px}
#dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#dots button{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:transparent;
  color:var(--muted);font-size:12px;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
#dots button.done{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
#dots button.cur{border-color:var(--accent);color:var(--fg);box-shadow:0 0 0 2px var(--accent) inset}
#dots button:disabled{opacity:.35;cursor:default}
.note{margin:0;font-size:12.5px;color:var(--muted);text-align:center}
.cta{align-self:center;min-width:220px}

/* lid */
#lid{transition:transform .5s cubic-bezier(.5,0,.3,1),opacity .45s;cursor:pointer}
#lid.open{transform:translateY(-330px);opacity:0;pointer-events:none}
#lid .tap{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}

/* style picker on the win card */
.reward{justify-content:space-between}
.styles{display:flex;gap:8px;flex:none}
.styles button{width:58px;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:3px}
.styles button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.styles svg{width:100%;height:100%;display:block;border-radius:9px}
.deco[data-i]{cursor:pointer}
.toast{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:var(--mint);color:var(--mint-ink);font-weight:800;
  font-size:15px;padding:8px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 20px rgba(20,12,30,.18);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}

/* daily box card */
.daily{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:18px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--fg);text-align:start;min-height:58px}
.daily svg{flex:none}
.daily .dtxt{flex:1;min-width:0}
.daily b{display:block;font-size:16px;line-height:1.2}
.daily .dsub{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.dpill{flex:none;display:flex;align-items:center;gap:4px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:6px 16px;font-size:14px}
.daily.done{cursor:default}
.daily.done .dpill{background:var(--mint);color:var(--mint-ink);padding:6px 10px}
.week{display:flex;justify-content:center;gap:6px;margin:-4px 0 14px}
.week span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:700}
.week i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.week .on i{background:var(--mint);border-color:var(--mint)}
.week .today i{box-shadow:0 0 0 2px var(--accent)}
.styles .pet{width:58px;height:58px;border-radius:14px;border:2px solid var(--line);overflow:hidden;background:var(--bg)}
.styles .pet svg{width:100%;height:100%;display:block}
.styles .pet.locked svg{opacity:.35;filter:grayscale(1)}

/* settings sheet */
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:min(520px,100%);max-height:92%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-top{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.sheet h2{margin:0;font-size:26px;font-weight:800;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;padding-block:12px;border-top:1px solid var(--line)}
.lbl{font-weight:700;font-size:15px}
.switch{width:54px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .2s}
.switch[aria-checked="true"]{background:var(--mint)}
.switch[aria-checked="true"]::after{inset-inline-start:26px}
.mailbox{display:flex;align-items:center;gap:8px;width:100%;padding:8px 8px 8px 14px;border-radius:14px;background:var(--bg)}
[dir="rtl"] .mailbox{padding:8px 14px 8px 8px}
.mail{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;direction:ltr;text-align:start}
.small{min-height:38px;padding:0 14px;font-size:14px}
.danger{color:var(--danger);border-color:var(--danger)}
.confirm{width:100%;display:flex;flex-direction:column;gap:8px}
.confirm p{margin:0;font-size:14px;color:var(--muted)}
.ver{margin:8px 0 0;font-size:12px;color:var(--muted);text-align:center}

@media (prefers-reduced-motion: reduce){
  .item.hint .art,.ghost.hint,.win,.deco.pop,.toast,.sheet,#lid .tap{animation:none}
  #lid{transition:none}
}
</style>

</head>
<body>
<div id="app">
  <div class="bar">
    <span class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="5" width="18" height="14" rx="4" fill="var(--accent)"/><rect x="5" y="2" width="4" height="9" rx="2" fill="var(--mint)"/><rect x="11" y="3" width="4" height="8" rx="2" fill="var(--fg)"/></svg>
      Tidy Nook
    </span>
    <button id="snd" class="icon" aria-pressed="true"></button>
    <button id="gear" class="icon"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.6 1.8h2.8l.5 2.3 1.4.8 2.2-.8 1.4 2.4-1.7 1.6v1.8l1.7 1.6-1.4 2.4-2.2-.8-1.4.8-.5 2.3H8.6l-.5-2.3-1.4-.8-2.2.8-1.4-2.4L4.8 10V8.2L3.1 6.6l1.4-2.4 2.2.8 1.4-.8z" fill="currentColor"/><circle cx="10" cy="9.1" r="2.6" fill="var(--surface)"/></svg></button>
  </div>

  <!-- HOUSE -->
  <section id="houseScr" class="screen" hidden>
    <div class="head"><div class="titles"><p id="hEye" class="eyebrow"></p><h1 id="hTitle"></h1></div></div>
    <button id="dailyCard" class="daily" hidden>
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="14" width="32" height="22" rx="4" fill="#E8A86E"/><rect x="2" y="9" width="36" height="9" rx="3" fill="#F2B48C"/><rect x="17" y="9" width="6" height="27" fill="#C9587C"/><path d="M20 9c-3-6-11-6-9-1 1 2 6 2 9 1zm0 0c3-6 11-6 9-1-1 2-6 2-9 1z" fill="#E58FA6"/></svg>
      <span class="dtxt"><b id="dTitle"></b><span id="dSub" class="dsub"></span></span>
      <span id="dBtn" class="dpill"></span>
    </button>
    <div class="stage"><svg id="house" viewBox="10 -146 340 574" preserveAspectRatio="xMidYMid meet" role="img"></svg><div id="toast" class="toast" hidden></div></div>
    <button id="cont" class="primary cta"></button>
    <p id="hTip" class="note"></p>
  </section>

  <!-- PLAY -->
  <section id="playScr" class="screen" hidden>
    <div class="head">
      <button id="home" class="icon"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3.5l7 6V17h-4.5v-4.5h-5V17H3z" fill="currentColor"/></svg></button>
      <div class="titles"><p id="lvlNo" class="eyebrow"></p><h1 id="lvlName"></h1></div>
      <button id="hint" class="hintbtn">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a4.5 4.5 0 0 0-2.6 8.2c.4.3.6.7.6 1.1V12h4v-1.2c0-.4.2-.8.6-1.1A4.5 4.5 0 0 0 8 1.5Z" fill="currentColor"/><rect x="6" y="13" width="4" height="1.6" rx=".8" fill="currentColor"/></svg>
        <span id="hintTxt"></span>
      </button>
    </div>
    <div class="stage">
      <svg id="board" viewBox="0 40 360 594" preserveAspectRatio="xMidYMid meet" aria-label="Game board">
        <g id="box"></g>
        <rect class="tray" x="14" y="364" width="332" height="262" rx="26"/>
        <rect class="stitch" x="24" y="374" width="312" height="242" rx="18"/>
        <g id="slots"></g>
        <g id="placed"></g>
        <g id="lid"></g>
        <g id="items"></g>
        <g id="fx"></g>
      </svg>
      <div id="win" class="win" hidden>
        <h2 id="winTitle"></h2>
        <p id="winSub"></p>
        <div class="reward"><div><b id="rewardName"></b><span id="rewardRoom"></span></div><div id="styles" class="styles" role="group"></div></div>
        <div id="week" class="week" hidden></div>
        <div class="btns"><button id="toHouse" class="secondary"></button><button id="next" class="primary"></button></div>
      </div>
    </div>
    <div class="foot"><nav id="dots"></nav><p id="note" class="note"></p></div>
  </section>
</div>

<!-- SETTINGS -->
<div id="scrim" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-top"><h2 id="setTitle"></h2><button id="setClose" class="icon"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4 4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="row"><span id="setLang" class="lbl"></span>
      <div class="langs" role="group" aria-label="Language">
        <button data-lang="tr">Türkçe</button><button data-lang="en">English</button><button data-lang="de">Deutsch</button><button data-lang="ar">العربية</button>
      </div>
    </div>
    <div class="row"><span id="setSnd" class="lbl"></span><button id="sndSwitch" class="switch" role="switch" aria-checked="true" aria-labelledby="setSnd"></button></div>
    <div class="row"><span id="setSup" class="lbl"></span>
      <div class="mailbox"><span id="mail" class="mail">nilkaren.tuncay.demir@gmail.com</span><button id="copy" class="secondary small"></button></div>
    </div>
    <div class="row">
      <span id="setReset" class="lbl"></span><button id="resetBtn" class="secondary small danger"></button>
      <div id="confirm" class="confirm" hidden><p id="resetQ"></p>
        <div class="btns"><button id="resetNo" class="secondary small"></button><button id="resetYes" class="primary small"></button></div></div>
    </div>
    <p id="ver" class="ver"></p>
  </div>
</div>

<script>
/* ---------- texts (TR / EN / DE / AR) ---------- */
const T={
  tr:{daily:"Günün kutusu",dailyReady:"Bugünün kutusu seni bekliyor",dailyDone:"Tamamlandı · Yarın yeni kutu",open:"Aç",

      tut:"Drag each item to its spot",note:"No timers · No ads",
      wins:["Spotless!","So neat!","Just right!"],sub:"One more box unpacked",newItem:"New for your home",
      hEye:"Your new home",hTitle:(d,n)=>`${d}/${n} boxes unpacked`,hAll:"Home is ready. Welcome in!",
      cont:n=>`Continue · Level ${n}`,again:"Play again",support:"Support",

      close:"Close",tapOpen:"Tap to open",style:"Pick a style",styleN:n=>`Style ${n}`,
      houseTip:"Tap furniture to change its colour",roomDone:r=>`${r} complete!`,ver:"Version 1.0.0",
      rooms:["Kitchen","Study","Bedroom","Bathroom","Kids' Room","Dressing Room"],

const R=(x,y,w,h,rx,c)=>({t:"r",x,y,w,h,rx,c}), C=(cx,cy,r,c)=>({t:"c",cx,cy,r,c}),
      E=(cx,cy,rx,ry,c)=>({t:"e",cx,cy,rx,ry,c}), P=(pts,c)=>({t:"p",pts,c});
function prim(p,fill,extra=""){
  const f=fill||p.c;
  if(p.t==="r")return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.rx}" fill="${f}"${extra}/>`;
  if(p.t==="c")return `<circle cx="${p.cx}" cy="${p.cy}" r="${p.r}" fill="${f}"${extra}/>`;
  if(p.t==="e")return `<ellipse cx="${p.cx}" cy="${p.cy}" rx="${p.rx}" ry="${p.ry}" fill="${f}"${extra}/>`;
  return `<polygon points="${p.pts}" fill="${f}"${extra}/>`;
}

  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d+.02);}

function drop(e){
  if(!drag||e.pointerId!==drag.id)return;
  const it=drag.it;drag=null;it.el.classList.remove("lift");

  slots.forEach(s=>{if(s.filled||s.k!==it.k)return;const d=Math.hypot(s.x-it.x,s.y-it.y);if(d<bd){bd=d;best=s;}});

  const daily=mode==="daily";
  $("lvlNo").textContent=daily?`${t.daily} · ${new Intl.DateTimeFormat(state.lang,{day:"numeric",month:"long"}).format(new Date())}`:`${t.level} ${i+1}/${N} · ${t.rooms[LROOM[i]]}`;
  $("lvlName").textContent=daily?t.themes[dailyTheme]:t.names[i];
  $("hintTxt").textContent=t.hint;
  $("note").textContent=!daily&&i===0&&!state.done.includes(0)?t.tut:t.note;
  if(daily){if(!$("win").hidden){renderDailyReward();$("week").hidden=false;}}
  else{
    $("winTitle").textContent=t.wins[i%t.wins.length];
    $("winSub").textContent=`${t.sub} · ${t.rooms[LROOM[i]]}`;
    $("rewardName").textContent=t.decor[i];
    $("rewardRoom").textContent=t.style;
    if(!$("win").hidden)renderStyles();
  }
  /* daily card on the house screen */
  const dd=dailyDoneToday(),st=liveStreak();
  $("dailyCard").hidden=!state.done.length;$("dailyCard").classList.toggle("done",dd);$("dailyCard").setAttribute("aria-disabled",dd);
  $("dTitle").textContent=t.daily;
  $("dSub").textContent=dd?`${t.dailyDone}${st>1?" · "+t.streak(st):""}`:(st?t.streak(st):t.dailyReady);
  $("dBtn").innerHTML=dd?'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.3l3 3 6-6.2" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>':t.open;
  if(screen==="play"&&!lidOpen&&!winShown&&lidL.querySelector(".tap"))lidL.querySelector(".tap").textContent=t.tapOpen;
  $("toHouse").textContent=t.seeHouse;
  const nxw=nextOpen();$("next").textContent=t.next;$("next").hidden=nxw<0||daily;
  const u=unlocked();
  $("dots").innerHTML=LEVELS.map((_,n)=>`<button data-l="${n}" class="${state.done.includes(n)?"done":""} ${n===i&&!daily?"cur":""}" ${n>u?"disabled":""} aria-label="${t.level} ${n+1}">${n+1}</button>`).join("");
  if(screen==="house"&&$("house").firstChild)renderHouseLabels();
}
function renderHouseLabels(){const keep=freshDecor,kp=freshPet;freshDecor=-2;freshPet=-2;renderHouse();freshDecor=keep;freshPet=kp;}
document.querySelector(".langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.lang=b.dataset.lang;save();texts();});
const toggleSound=()=>{state.sound=!state.sound;save();texts();if(state.sound){audio();sfx.pick();}};
$("snd").addEventListener("click",toggleSound);
$("sndSwitch").addEventListener("click",toggleSound);
/* settings sheet */
function openSettings(){$("confirm").hidden=true;$("resetBtn").hidden=false;$("copy").textContent=T[state.lang].copy;$("scrim").hidden=false;$("setClose").focus();}
function closeSettings(){$("scrim").hidden=true;$("gear").focus();}
$("gear").addEventListener("click",()=>{audio();openSettings();});
$("setClose").addEventListener("click",closeSettings);
$("scrim").addEventListener("click",e=>{if(e.target===$("scrim"))closeSettings();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeSettings();});
$("copy").addEventListener("click",()=>{
  const ok=()=>{$("copy").textContent=T[state.lang].copied;setTimeout(()=>$("copy").textContent=T[state.lang].copy,1800);};
  const sel=()=>{const r=document.createRange();r.selectNodeContents($("mail"));const s=getSelection();s.removeAllRanges();s.addRange(r);};
  try{navigator.clipboard.writeText($("mail").textContent).then(ok,sel);}catch(e){sel();}
});
$("resetBtn").addEventListener("click",()=>{$("resetBtn").hidden=true;$("confirm").hidden=false;$("resetNo").focus();});
$("resetNo").addEventListener("click",()=>{$("confirm").hidden=true;$("resetBtn").hidden=false;});
$("resetYes").addEventListener("click",()=>{
  state.done=[];state.styles={};state.daily={last:"",streak:0,total:0,days:[]};state.level=0;save();closeSettings();build(0);
});
$("dots").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;build(+b.dataset.l);});
$("next").addEventListener("click",()=>{audio();const nx=nextOpen();build(nx<0?0:nx);});
$("toHouse").addEventListener("click",()=>{audio();goHouse();});
$("home").addEventListener("click",()=>{audio();freshDecor=-1;goHouse();});
$("cont").addEventListener("click",()=>{audio();const nx=nextOpen();build(nx<0?0:nx);});

/* ---------- boot ---------- */
function start(){
  if(!state.done.length)build(0);
  else{state.level=Math.min(state.level||0,LEVELS.length-1);goHouse();}
}
/* Android back button: close settings, leave a level, otherwise let the app close */
window.tidyBack=()=>{
  if(!$("scrim").hidden){closeSettings();return true;}
  if(screen==="play"){freshDecor=-1;goHouse();return true;}
  return false;
};
window.claude?.hot?.snapshot?.(()=>({}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
</script>

</body>
</html>
