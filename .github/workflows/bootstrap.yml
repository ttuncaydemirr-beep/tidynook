# One-time job: generates the Android and web project files with `flutter create`
# (this cannot run in the editing environment), commits them, and deletes itself.
name: Bootstrap Flutter scaffold
on:
  push:
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform files
        run: |
          flutter --version | tee FLUTTER_VERSION.txt
          flutter create --org com.tidynook --project-name tidy_nook --platforms android,web --no-pub .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/bootstrap.yml
          git add -A
          git commit -m "Generate Flutter Android and web project files (flutter create)"
          git push
