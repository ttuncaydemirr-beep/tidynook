# Builds the Flutter app: Play bundle (.aab), test .apk and a web preview, then publishes them on the
# "latest-build" release. Signing uses four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the build still runs, but the files are unsigned and cannot be uploaded to Play.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      # Only errors fail; infos and warnings are printed in full.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Restore upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing, so this build is unsigned and cannot be uploaded to Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "TIDY_KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app bundle
        env:
          TIDY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TIDY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TIDY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Build APK
        env:
          TIDY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TIDY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TIDY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # An unsigned release APK is named app-release-unsigned.apk by AGP; the Flutter tool may
          # report an error for it even though the file exists, so accept that case when the file is there.
          if ! flutter build apk --release; then
            if [ "${{ steps.key.outputs.signed }}" != "true" ] && find build/app/outputs -name '*.apk' | grep -q .; then
              echo "::warning::flutter build apk reported an error for the unsigned APK, but an APK was produced."
            else
              exit 1
            fi
          fi

      - name: Build web
        run: |
          FLAGS=""
          if flutter build web -h 2>&1 | grep -q -- '--no-web-resources-cdn'; then
            FLAGS="--no-web-resources-cdn"
          fi
          flutter build web --release $FLAGS

      - name: Collect files
        run: |
          mkdir -p out
          cp build/app/outputs/bundle/release/app-release.aab out/app-release.aab
          APK=$(find build/app/outputs -name 'app-release.apk' -o -name 'app-release-unsigned.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No release APK found"; find build/app/outputs -name '*.apk'; exit 1; fi
          echo "Using $APK"
          cp "$APK" out/app-release.apk
          (cd build/web && zip -qr "$GITHUB_WORKSPACE/out/web.zip" .)
          ls -l out

      # Android 15+ devices with 16 KB pages need native libraries aligned to 16 KB.
      - name: Check 16 KB page alignment
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
          ZA="${BT}zipalign"
          if [ ! -x "$ZA" ]; then echo "::warning::zipalign not found under $SDK/build-tools"; exit 0; fi
          echo "Using $ZA"
          if "$ZA" 2>&1 | grep -q -- '-P'; then
            if "$ZA" -c -P 16 -v 4 out/app-release.apk > "$RUNNER_TEMP/zipalign.log" 2>&1; then
              echo "16 KB alignment OK"
            else
              echo "::warning::16 KB page alignment check failed (see the log)"
            fi
            grep -E '\.so|Verification' "$RUNNER_TEMP/zipalign.log" || tail -n 20 "$RUNNER_TEMP/zipalign.log"
          else
            echo "::warning::This zipalign has no -P option, so the 16 KB check was skipped."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.signed == 'true' && 'tidy-nook-release' || 'tidy-nook-UNSIGNED-test-only' }}
          path: out/*
          if-no-files-found: error

      # Also put the files on the repository's "latest-build" release page,
      # so they can be downloaded without signing in.
      - name: Publish to the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLUTTER_VER=$(flutter --version | head -n 1)
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build out/app-release.aab out/app-release.apk out/web.zip \
            --prerelease --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. ${FLUTTER_VER}. Signed: ${{ steps.key.outputs.signed }}."
