# Builds the Play Store bundle (.aab) and a test .apk in GitHub's cloud.
# Runs on every push to main, or by hand: Actions tab > "Build release" > Run workflow.
# Signing uses four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the build still runs, but the files are unsigned and cannot be uploaded to Play.
name: Build release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; only add Android 16 to it.
      - name: Install Android 16 SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then echo "::error::sdkmanager not found under $SDK"; ls "$SDK" || true; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing, so this build is unsigned and cannot be uploaded to Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "TIDY_KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle and APK
        env:
          TIDY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TIDY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TIDY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.signed == 'true' && 'tidy-nook-release' || 'tidy-nook-UNSIGNED-test-only' }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
