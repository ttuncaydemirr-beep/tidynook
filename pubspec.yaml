name: tidy_nook
description: "Tidy Nook - a relaxing organizing puzzle game."
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  # 1.1 monetization and services (lib/monet, lib/services; docs/MONETIZATION.md). Versions as in Arrowtile where it has them.
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ">=0.4.0 <1.0.0" # GooglePlayPurchaseDetails.billingClientPurchase (pending purchases)
  in_app_review: ^2.0.10
  # 21.x: compileSdk 36, minSdk 24, desugaring required (22+ adds web, 23 needs compileSdk 37 / AGP 9.1.1)
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  # Optional analytics + crash reports: without android/app/google-services.json the app runs without them.
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
    - assets/fonts/OFL.txt # Baloo Bhaijaan 2 license, shown via lib/services/licenses.dart
  fonts:
    - family: Baloo
      fonts:
        - asset: assets/fonts/BalooBhaijaan2.ttf
