name: tidy_nook
description: "Tidy Nook - a relaxing organizing puzzle game."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
  fonts:
    - family: Baloo
      fonts:
        - asset: assets/fonts/BalooBhaijaan2.ttf
