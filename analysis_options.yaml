# Static analysis for Tidy Nook. CI runs `flutter analyze --no-fatal-infos --no-fatal-warnings`,
# so only real errors fail the build; lints show up as infos and are printed in the log.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - lib/l10n/gen/**
